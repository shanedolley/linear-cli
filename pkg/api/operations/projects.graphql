# GraphQL operations for Project entity
# These operations will replace hand-written queries in pkg/api/queries.go

# Fragment for basic project fields used in list views
fragment ProjectListFields on Project {
  id
  name
  description
  state
  progress
  startDate
  targetDate
  url
  createdAt
  updatedAt
  lead {
    id
    name
    email
  }
  teams {
    nodes {
      id
      key
      name
    }
  }
}

# Fragment for detailed project fields used in single project view
fragment ProjectDetailFields on Project {
  id
  slugId
  name
  description
  content
  state
  progress
  health
  scope
  startDate
  targetDate
  url
  icon
  color
  createdAt
  updatedAt
  completedAt
  canceledAt
  archivedAt
  slackNewIssue
  slackIssueComments
  slackIssueStatuses
  lead {
    id
    name
    email
    avatarUrl
    displayName
    active
  }
  creator {
    id
    name
    email
    avatarUrl
    active
  }
  convertedFromIssue {
    id
    identifier
    title
  }
  lastAppliedTemplate {
    id
    name
    description
  }
  teams {
    nodes {
      id
      key
      name
      description
      icon
      color
      cyclesEnabled
    }
  }
  members {
    nodes {
      id
      name
      email
      avatarUrl
      displayName
      active
      admin
    }
  }
  issues(first: 50, orderBy: updatedAt) {
    nodes {
      id
      identifier
      number
      title
      description
      priority
      estimate
      createdAt
      updatedAt
      completedAt
      state {
        name
        type
        color
      }
      assignee {
        name
        email
      }
      labels {
        nodes {
          name
          color
        }
      }
    }
  }
  projectUpdates(first: 10) {
    nodes {
      id
      body
      health
      createdAt
      updatedAt
      editedAt
      user {
        name
        email
        avatarUrl
      }
    }
  }
  documents(first: 20) {
    nodes {
      id
      title
      content
      icon
      color
      createdAt
      updatedAt
      creator {
        name
        email
      }
      updatedBy {
        name
        email
      }
    }
  }
  labels(first: 20) {
    nodes {
      id
      name
      color
    }
  }
  relations(first: 20) {
    nodes {
      id
      type
      relatedProject {
        id
        name
      }
    }
  }
  inverseRelations(first: 20) {
    nodes {
      id
      type
      project {
        id
        name
      }
    }
  }
}

# Query: Get paginated list of projects with optional filtering
query ListProjects($filter: ProjectFilter, $first: Int, $after: String, $orderBy: PaginationOrderBy) {
  projects(filter: $filter, first: $first, after: $after, orderBy: $orderBy) {
    nodes {
      ...ProjectListFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Query: Get a single project by ID with all details
query GetProject($id: String!) {
  project(id: $id) {
    ...ProjectDetailFields
  }
}

# Mutation: Create a new project
mutation CreateProject($input: ProjectCreateInput!) {
  projectCreate(input: $input) {
    success
    project {
      ...ProjectListFields
    }
  }
}

# Mutation: Update an existing project's record (name, description, lead,
# dates, status, members, etc). ProjectUpdateInput has no `state`/`health`
# fields (verified against schema.graphql) - health is only set via a
# project update *post* (a separate ProjectUpdate mutation/entity, not
# covered here), and state is derived from the project's status.
mutation UpdateProject($id: String!, $input: ProjectUpdateInput!) {
  projectUpdate(id: $id, input: $input) {
    success
    project {
      ...ProjectListFields
    }
  }
}

# Mutation: Delete (trash) a project. Can be restored with ProjectUnarchive.
#
# Returns ProjectArchivePayload (entity: Project, or null if deleted), unlike
# the DeletePayload (entityId) shape used by InitiativeDelete - Project's
# delete mutation is actually a soft "trash" (see the mutation's own schema
# description), so the entity is still returned.
mutation ProjectDelete($id: String!) {
  projectDelete(id: $id) {
    success
    entity {
      id
      name
    }
  }
}

# Mutation: Unarchive (restore) a previously deleted/archived project
mutation ProjectUnarchive($id: String!) {
  projectUnarchive(id: $id) {
    success
    entity {
      id
      name
    }
  }
}

# --- Project statuses (workspace-wide catalog, used to resolve --status
# name -> statusId; see resolveProjectStatus in cmd/resolve.go) ---

fragment ProjectStatusFields on ProjectStatus {
  id
  name
  type
  color
  description
  position
  indefinite
  archivedAt
}

query ListProjectStatuses($first: Int) {
  projectStatuses(first: $first) {
    nodes {
      ...ProjectStatusFields
    }
  }
}

# --- Project milestones ---

fragment ProjectMilestoneFields on ProjectMilestone {
  id
  name
  description
  targetDate
  status
  sortOrder
  progress
  createdAt
  updatedAt
}

# Query: list a project's milestones. Queried via Project.projectMilestones
# rather than the top-level projectMilestones(filter:) connection - simpler,
# and avoids needing ProjectMilestoneFilter's NullableProjectFilter shape
# just to match on project id.
query ListProjectMilestones($projectId: String!, $first: Int) {
  project(id: $projectId) {
    projectMilestones(first: $first) {
      nodes {
        ...ProjectMilestoneFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetProjectMilestone($id: String!) {
  projectMilestone(id: $id) {
    ...ProjectMilestoneFields
    project {
      id
      name
    }
  }
}

mutation ProjectMilestoneCreate($input: ProjectMilestoneCreateInput!) {
  projectMilestoneCreate(input: $input) {
    success
    projectMilestone {
      ...ProjectMilestoneFields
    }
  }
}

mutation ProjectMilestoneUpdate($id: String!, $input: ProjectMilestoneUpdateInput!) {
  projectMilestoneUpdate(id: $id, input: $input) {
    success
    projectMilestone {
      ...ProjectMilestoneFields
    }
  }
}

# ProjectMilestoneMoveInput has no sortOrder field (verified against
# schema.graphql) - only projectId (plus team-mismatch escape hatches this
# CLI doesn't need). `project milestone move --sort-order` is implemented as
# this move followed by a ProjectMilestoneUpdate call when --sort-order is
# given; see cmd/project.go.
mutation ProjectMilestoneMove($id: String!, $input: ProjectMilestoneMoveInput!) {
  projectMilestoneMove(id: $id, input: $input) {
    success
    projectMilestone {
      ...ProjectMilestoneFields
      project {
        id
        name
      }
    }
  }
}

mutation ProjectMilestoneDelete($id: String!) {
  projectMilestoneDelete(id: $id) {
    success
    entityId
  }
}

# --- Project labels (ProjectLabel - a distinct workspace-wide catalog from
# IssueLabel and InitiativeLabel; confirmed against schema.graphql, which
# has no cross-reference between the three label types) ---

fragment ProjectLabelFields on ProjectLabel {
  id
  name
  color
  description
  isGroup
  archivedAt
  retiredAt
  parent {
    id
    name
  }
}

query ListProjectLabels($filter: ProjectLabelFilter, $first: Int) {
  projectLabels(filter: $filter, first: $first) {
    nodes {
      ...ProjectLabelFields
    }
  }
}

mutation ProjectLabelCreate($input: ProjectLabelCreateInput!) {
  projectLabelCreate(input: $input) {
    success
    projectLabel {
      ...ProjectLabelFields
    }
  }
}

mutation ProjectLabelUpdate($id: String!, $input: ProjectLabelUpdateInput!) {
  projectLabelUpdate(id: $id, input: $input) {
    success
    projectLabel {
      ...ProjectLabelFields
    }
  }
}

mutation ProjectLabelDelete($id: String!) {
  projectLabelDelete(id: $id) {
    success
    entityId
  }
}

# Retire/restore, not archive/unarchive - ProjectLabel has no
# projectLabelArchive mutation (verified against schema.graphql). Retired
# labels remain on projects that already use them but can't be applied to
# new ones.
mutation ProjectLabelRetire($id: String!) {
  projectLabelRetire(id: $id) {
    success
    projectLabel {
      ...ProjectLabelFields
    }
  }
}

mutation ProjectLabelRestore($id: String!) {
  projectLabelRestore(id: $id) {
    success
    projectLabel {
      ...ProjectLabelFields
    }
  }
}

mutation ProjectAddLabel($id: String!, $labelId: String!) {
  projectAddLabel(id: $id, labelId: $labelId) {
    success
    project {
      ...ProjectListFields
    }
  }
}

mutation ProjectRemoveLabel($id: String!, $labelId: String!) {
  projectRemoveLabel(id: $id, labelId: $labelId) {
    success
    project {
      ...ProjectListFields
    }
  }
}

# --- Project relations (Gantt-style dependency relations between projects) ---
#
# Unlike IssueRelation/InitiativeRelation, ProjectRelationCreateInput's
# `type`, `anchorType`, and `relatedAnchorType` fields are plain strings in
# schema.graphql (String!, not a GraphQL enum). The API still enforces a
# fixed set of values for each server-side, though - confirmed live via
# INVALID_INPUT/isEnum validation errors surfaced on a bad guess:
#   - type: dependency (the only value currently accepted)
#   - anchorType / relatedAnchorType: start, end, milestone
# ("project" - the original guess based on the field descriptions alone -
# is rejected). cmd/project.go's `project relate` validates --type against
# this real set and always anchors the source project's "end" to the
# target's "start" (a finish-to-start dependency); anchoring to a specific
# milestone (via projectMilestoneId/relatedProjectMilestoneId) isn't
# exposed by this CLI.
fragment ProjectRelationFields on ProjectRelation {
  id
  type
  anchorType
  relatedAnchorType
  project {
    id
    name
  }
  relatedProject {
    id
    name
  }
}

# Query: fetch both directions of a project's relations (outgoing via
# `relations`, incoming via `inverseRelations`), used by `project unrelate`
# to locate a relation's join id regardless of which project it was created
# from. Project's relation connections take no filter argument for matching
# a specific related project, so the caller matches client-side.
query GetProjectRelations($id: String!, $first: Int) {
  project(id: $id) {
    relations(first: $first) {
      nodes {
        ...ProjectRelationFields
      }
    }
    inverseRelations(first: $first) {
      nodes {
        ...ProjectRelationFields
      }
    }
  }
}

mutation ProjectRelationCreate($input: ProjectRelationCreateInput!) {
  projectRelationCreate(input: $input) {
    success
    projectRelation {
      ...ProjectRelationFields
    }
  }
}

mutation ProjectRelationUpdate($id: String!, $input: ProjectRelationUpdateInput!) {
  projectRelationUpdate(id: $id, input: $input) {
    success
    projectRelation {
      ...ProjectRelationFields
    }
  }
}

mutation ProjectRelationDelete($id: String!) {
  projectRelationDelete(id: $id) {
    success
    entityId
  }
}

# --- Project status CRUD/lifecycle (workspace-wide catalog) ---
#
# ListProjectStatuses/ProjectStatusFields already exist above, used by
# resolveProjectStatus. Extended here with create/update/archive/unarchive
# and the reassign-status mutation (used when archiving or deleting a
# status that still has projects assigned to it).

mutation ProjectStatusCreate($input: ProjectStatusCreateInput!) {
  projectStatusCreate(input: $input) {
    success
    status {
      ...ProjectStatusFields
    }
  }
}

mutation ProjectStatusUpdate($id: String!, $input: ProjectStatusUpdateInput!) {
  projectStatusUpdate(id: $id, input: $input) {
    success
    status {
      ...ProjectStatusFields
    }
  }
}

mutation ProjectStatusArchive($id: String!) {
  projectStatusArchive(id: $id) {
    success
    entity {
      ...ProjectStatusFields
    }
  }
}

mutation ProjectStatusUnarchive($id: String!) {
  projectStatusUnarchive(id: $id) {
    success
    entity {
      ...ProjectStatusFields
    }
  }
}

# [INTERNAL] per the schema's own description - reassigns all of one
# status's projects onto another status. projectReassignStatus takes its
# two ids as direct arguments, not a wrapped input type (verified against
# schema.graphql - there is no ProjectReassignStatusInput).
mutation ProjectReassignStatus($originalProjectStatusId: String!, $newProjectStatusId: String!) {
  projectReassignStatus(originalProjectStatusId: $originalProjectStatusId, newProjectStatusId: $newProjectStatusId) {
    success
  }
}

# --- Project status-update posts (ProjectUpdate) ---
#
# Kept clearly distinct from the `UpdateProject`/`projectUpdate` mutation
# above (which edits the Project record itself): these are point-in-time
# status posts, named `project update-post` in the CLI, mirroring
# `initiative update-post`. The mutation names below match Linear's own
# field names exactly (projectUpdateCreate, projectUpdateUpdate, ...)
# rather than being prefixed like the Initiative equivalents
# (CreateInitiativeUpdate) - both forms are collision-free since genqlient
# derives the generated Go function name from the operation name, and the
# query GetProjectUpdate is already distinct from the ProjectUpdateCreate/
# ProjectUpdateUpdate mutations.
fragment ProjectUpdateFields on ProjectUpdate {
  id
  slugId
  body
  health
  createdAt
  updatedAt
  editedAt
  archivedAt
  url
  user {
    id
    name
    email
  }
  project {
    id
    name
  }
}

query ListProjectUpdates($filter: ProjectUpdateFilter, $first: Int, $after: String, $orderBy: PaginationOrderBy) {
  projectUpdates(filter: $filter, first: $first, after: $after, orderBy: $orderBy) {
    nodes {
      ...ProjectUpdateFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetProjectUpdate($id: String!) {
  projectUpdate(id: $id) {
    ...ProjectUpdateFields
  }
}

mutation ProjectUpdateCreate($input: ProjectUpdateCreateInput!) {
  projectUpdateCreate(input: $input) {
    success
    projectUpdate {
      ...ProjectUpdateFields
    }
  }
}

mutation ProjectUpdateUpdate($id: String!, $input: ProjectUpdateUpdateInput!) {
  projectUpdateUpdate(id: $id, input: $input) {
    success
    projectUpdate {
      ...ProjectUpdateFields
    }
  }
}

mutation ProjectUpdateArchive($id: String!) {
  projectUpdateArchive(id: $id) {
    success
    entity {
      id
      archivedAt
    }
  }
}

mutation ProjectUpdateUnarchive($id: String!) {
  projectUpdateUnarchive(id: $id) {
    success
    entity {
      id
      archivedAt
    }
  }
}

mutation CreateProjectUpdateReminder($projectId: String!, $userId: String) {
  createProjectUpdateReminder(projectId: $projectId, userId: $userId) {
    success
  }
}
