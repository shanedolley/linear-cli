# GraphQL operations for User entity
# These operations will replace hand-written queries in pkg/api/queries.go

# Fragment for basic user fields used in list views
fragment UserListFields on User {
  id
  name
  email
  avatarUrl
  isMe
  active
  admin
}

# Fragment for detailed user fields (if needed in the future)
fragment UserDetailFields on User {
  id
  name
  email
  avatarUrl
  displayName
  isMe
  active
  admin
  createdAt
}

# Query: Get paginated list of users
query ListUsers($first: Int, $after: String, $orderBy: PaginationOrderBy) {
  users(first: $first, after: $after, orderBy: $orderBy) {
    nodes {
      ...UserListFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Query: Get a single user by email using filter
# Note: Linear's user query takes id, not email, so we use users with filter
query GetUserByEmail($filter: UserFilter!) {
  users(filter: $filter, first: 1) {
    nodes {
      ...UserDetailFields
    }
  }
}

# Query: Get the current authenticated user (viewer)
query GetViewer {
  viewer {
    ...UserDetailFields
  }
}

# Mutation: Update a user's profile
mutation UserUpdate($id: String!, $input: UserUpdateInput!) {
  userUpdate(id: $id, input: $input) {
    success
    user {
      ...UserDetailFields
    }
  }
}

# Mutation: Change a user's organization role (owner|admin|guest|user|app).
# Distinct from team membership ownership; returns success only.
mutation UserChangeRole($id: String!, $role: UserRoleType!) {
  userChangeRole(id: $id, role: $role) {
    success
  }
}

# Mutation: Suspend a user (executes immediately)
mutation UserSuspend($id: String!) {
  userSuspend(id: $id) {
    success
  }
}

# Mutation: Unsuspend a user
mutation UserUnsuspend($id: String!) {
  userUnsuspend(id: $id) {
    success
  }
}

# Query: the authenticated user's settings. userSettingsUpdate is keyed on the
# UserSettings ID (not the user ID), and Linear only exposes the viewer's own
# settings, so `user settings update` is self-scoped.
query GetUserSettings {
  userSettings {
    id
  }
}

# Mutation: Update the authenticated user's settings
mutation UserSettingsUpdate($id: String!, $input: UserSettingsUpdateInput!) {
  userSettingsUpdate(id: $id, input: $input) {
    success
  }
}
