# GraphQL operations for Issue entity
# These operations will replace hand-written queries in pkg/api/queries.go

# Fragment for basic issue fields used in list views
fragment IssueListFields on Issue {
  id
  identifier
  title
  description
  priority
  estimate
  createdAt
  updatedAt
  dueDate
  url
  state {
    id
    name
    type
    color
  }
  assignee {
    id
    name
    email
  }
  team {
    id
    key
    name
  }
  labels {
    nodes {
      id
      name
      color
    }
  }
}

# Fragment for detailed issue fields used in single issue view
fragment IssueDetailFields on Issue {
  id
  identifier
  number
  title
  description
  priority
  priorityLabel
  estimate
  boardOrder
  subIssueSortOrder
  createdAt
  updatedAt
  dueDate
  url
  branchName
  snoozedUntilAt
  completedAt
  canceledAt
  archivedAt
  triagedAt
  customerTicketCount
  previousIdentifiers
  integrationSourceType
  state {
    id
    name
    type
    color
    description
    position
  }
  assignee {
    id
    name
    email
    avatarUrl
    displayName
    active
    admin
    createdAt
  }
  creator {
    id
    name
    email
    avatarUrl
    displayName
    active
  }
  team {
    id
    key
    name
    description
    icon
    color
    cyclesEnabled
    cycleStartDay
    cycleDuration
    upcomingCycleCount
    states {
      nodes {
        id
        name
        type
        color
        description
        position
      }
    }
  }
  labels {
    nodes {
      id
      name
      color
      description
      parent {
        id
        name
      }
    }
  }
  parent {
    id
    identifier
    title
    state {
      name
      type
    }
  }
  children {
    nodes {
      id
      identifier
      title
      priority
      createdAt
      state {
        name
        type
        color
      }
      assignee {
        name
        email
      }
    }
  }
  cycle {
    id
    number
    name
    description
    startsAt
    endsAt
    progress
    completedAt
    scopeHistory
  }
  project {
    id
    name
    description
    state
    progress
    startDate
    targetDate
    health
    lead {
      name
      email
    }
  }
  attachments(first: 20) {
    nodes {
      id
      title
      subtitle
      url
      metadata
      createdAt
      creator {
        name
        email
      }
    }
  }
  comments(first: 10) {
    nodes {
      id
      body
      createdAt
      updatedAt
      editedAt
      user {
        name
        email
        avatarUrl
      }
      parent {
        id
      }
      children {
        nodes {
          id
          body
          user {
            name
          }
        }
      }
    }
  }
  subscribers {
    nodes {
      id
      name
      email
      avatarUrl
    }
  }
  relations {
    nodes {
      id
      type
      relatedIssue {
        id
        identifier
        title
        state {
          name
          type
        }
      }
    }
  }
  history(first: 10) {
    nodes {
      id
      createdAt
      updatedAt
      actor {
        name
        email
      }
      fromAssignee {
        name
      }
      toAssignee {
        name
      }
      fromState {
        name
      }
      toState {
        name
      }
      fromPriority
      toPriority
      fromTitle
      toTitle
      fromCycle {
        name
      }
      toCycle {
        name
      }
      fromProject {
        name
      }
      toProject {
        name
      }
      addedLabelIds
      removedLabelIds
    }
  }
  reactions {
    id
    emoji
    user {
      name
      email
    }
    createdAt
  }
  externalUserCreator {
    id
    name
    email
    avatarUrl
  }
}

# Query: Get paginated list of issues with optional filtering
query ListIssues($filter: IssueFilter, $first: Int, $after: String, $orderBy: PaginationOrderBy) {
  issues(filter: $filter, first: $first, after: $after, orderBy: $orderBy) {
    nodes {
      ...IssueListFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Query: Search issues using full-text search
query SearchIssues($term: String!, $filter: IssueFilter, $first: Int, $after: String, $orderBy: PaginationOrderBy, $includeArchived: Boolean) {
  searchIssues(term: $term, filter: $filter, first: $first, after: $after, orderBy: $orderBy, includeArchived: $includeArchived) {
    nodes {
      id
      identifier
      title
      description
      priority
      estimate
      createdAt
      updatedAt
      dueDate
      url
      state {
        id
        name
        type
        color
      }
      assignee {
        id
        name
        email
      }
      team {
        id
        key
        name
      }
      labels {
        nodes {
          id
          name
          color
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Query: Get a single issue by ID with all details
query GetIssue($id: String!) {
  issue(id: $id) {
    ...IssueDetailFields
  }
}

# Mutation: Create a new issue
mutation CreateIssue($input: IssueCreateInput!) {
  issueCreate(input: $input) {
    issue {
      ...IssueListFields
    }
  }
}

# Mutation: Update an existing issue
mutation UpdateIssue($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    issue {
      ...IssueListFields
    }
  }
}

# Mutation: Create a relation between two issues
mutation CreateIssueRelation($input: IssueRelationCreateInput!) {
  issueRelationCreate(input: $input) {
    issueRelation {
      id
      type
      issue {
        id
        identifier
        title
      }
      relatedIssue {
        id
        identifier
        title
      }
    }
    success
  }
}

# Mutation: Delete an issue relation
mutation DeleteIssueRelation($id: String!) {
  issueRelationDelete(id: $id) {
    success
  }
}

# --- Issue lifecycle (Tier 2) ---

# Archive an issue. trash=true moves it to trash (soft delete with 30-day
# grace) rather than plain archive.
mutation IssueArchive($id: String!, $trash: Boolean) {
  issueArchive(id: $id, trash: $trash) {
    success
    entity {
      ...IssueListFields
    }
  }
}

mutation IssueUnarchive($id: String!) {
  issueUnarchive(id: $id) {
    success
    entity {
      ...IssueListFields
    }
  }
}

# Delete (trash) an issue. permanentlyDelete skips the 30-day grace period and
# is admin-only.
mutation IssueDelete($id: String!, $permanentlyDelete: Boolean) {
  issueDelete(id: $id, permanentlyDelete: $permanentlyDelete) {
    success
    entity {
      ...IssueListFields
    }
  }
}

# Subscribe/unsubscribe the given user (default: the current user) to an issue.
mutation IssueSubscribe($id: String!, $userId: String) {
  issueSubscribe(id: $id, userId: $userId) {
    success
    issue {
      ...IssueListFields
    }
  }
}

mutation IssueUnsubscribe($id: String!, $userId: String) {
  issueUnsubscribe(id: $id, userId: $userId) {
    success
    issue {
      ...IssueListFields
    }
  }
}

# Schedule a reminder notification for an issue at the given time.
mutation IssueReminder($id: String!, $reminderAt: DateTime!) {
  issueReminder(id: $id, reminderAt: $reminderAt) {
    success
    issue {
      ...IssueListFields
    }
  }
}

# Share/unshare an issue with a specific user.
mutation IssueShare($id: String!, $userId: String!) {
  issueShare(id: $id, userId: $userId) {
    success
    issue {
      ...IssueListFields
    }
  }
}

mutation IssueUnshare($id: String!, $userId: String!) {
  issueUnshare(id: $id, userId: $userId) {
    success
    issue {
      ...IssueListFields
    }
  }
}

# --- Issue bulk operations (Tier 2) ---

mutation IssueBatchCreate($input: IssueBatchCreateInput!) {
  issueBatchCreate(input: $input) {
    success
    issues {
      ...IssueListFields
    }
  }
}

# Update up to 50 issues at once with a single partial update.
mutation IssueBatchUpdate($ids: [UUID!]!, $input: IssueUpdateInput!) {
  issueBatchUpdate(ids: $ids, input: $input) {
    success
    issues {
      ...IssueListFields
    }
  }
}
