# Step 1 of file upload: Get pre-signed URL
mutation FileUpload($contentType: String!, $filename: String!, $size: Int!) {
  fileUpload(contentType: $contentType, filename: $filename, size: $size) {
    success
    uploadFile {
      uploadUrl
      assetUrl
      headers {
        key
        value
      }
    }
  }
}

# Step 2 of file upload & URL attachments: Create attachment
mutation AttachmentCreate($input: AttachmentCreateInput!) {
  attachmentCreate(input: $input) {
    success
    attachment {
      id
      title
      url
      createdAt
    }
  }
}

# List attachments on an issue
query ListAttachments($issueId: String!, $first: Int, $after: String, $orderBy: PaginationOrderBy) {
  issue(id: $issueId) {
    id
    attachments(first: $first, after: $after, orderBy: $orderBy) {
      nodes {
        id
        title
        subtitle
        url
        metadata
        createdAt
        updatedAt
        creator {
          email
          name
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Update attachment metadata
mutation AttachmentUpdate($id: String!, $input: AttachmentUpdateInput!) {
  attachmentUpdate(id: $id, input: $input) {
    success
    attachment {
      id
      title
      subtitle
      url
    }
  }
}

# Delete attachment
mutation AttachmentDelete($id: String!) {
  attachmentDelete(id: $id) {
    success
  }
}

# --- Typed link attachments (Tier 4c) ---
#
# Each mutation links a URL to an issue as a provider-typed attachment. When the
# workspace has the matching integration, Linear builds a rich attachment (e.g.
# status sync); otherwise a basic attachment. `attachment link --provider`
# dispatches to these.
#
# Only the providers whose mutation takes just (issueId, url) are exposed: url,
# slack, github-issue, github-pr, salesforce. The default `url` provider
# auto-detects recognized integration URLs (Zendesk, Jira, GitLab, GitHub,
# Slack, ...) and still builds the rich attachment, so it covers the providers
# whose typed mutations require extra structured identifiers (Discord's
# channelId/messageId, Zendesk's ticketId, Jira's jiraIssueId, GitLab's
# number/projectPath) as well as Front/Intercom (which key on a conversationId).

mutation AttachmentLinkURL($issueId: String!, $url: String!, $title: String) {
  attachmentLinkURL(issueId: $issueId, url: $url, title: $title) {
    success
    attachment {
      id
      title
      url
      createdAt
    }
  }
}

